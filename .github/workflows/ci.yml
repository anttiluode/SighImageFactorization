name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy
      - run: python -m unittest discover -s tests -v
      - run: python gate0_exact_residue.py
      - run: python gate1_source_separation.py --samples 256 --seeds 3
      - run: python gate2_frame_geometry.py
      - run: python gate3_same_graph_binding.py --seeds 3
      - run: python gate4_common_fate_write.py
