name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy
      - run: python -m unittest discover -s tests -v
      - run: python gate0_exact_residue.py
      - run: python gate1_source_separation.py --samples 256 --seeds 3
      - run: python gate2_frame_geometry.py
      - run: python gate3_same_graph_binding.py --seeds 3
      - run: python gate4_common_fate_write.py
      - run: python gate5_continuous_common_fate.py --samples 6
      - run: python gate6_estimated_motion_write.py --test-scenes 6
      - run: python gate7_occlusion_relational_bridge.py --scenes 6
      - run: python gate8_persistent_phase_address.py --scenes 6
      - run: python gate9_emergent_phase_address.py --scenes 6
      - run: python gate10_local_vector_address.py --scenes 12 --capacity-trials 20000
      - run: python gate11_contact_persistence.py --trials 2000
      - run: python gate12_learned_relation_timescale.py --train-trials 1200 --test-trials 2000
      - run: python gate13_predictive_relation_admission.py --train-trials 1200 --test-trials 2000
      - run: python gate14_rgb_predictive_relation_admission.py --train-trials 120 --test-trials 200
      - run: python gate15_track_confidence_admission.py --train-trials 80 --test-trials 120
      - run: python gate16_recoverable_uncertainty.py --train-trials 80 --test-trials 120 --threshold-train-trials 80
